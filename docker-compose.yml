services:
  db:
    image: postgres:16-alpine
    container_name: cti-postgres
    environment:
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: cti
      POSTGRES_DB: cti
    ports:
      - "5432:5432"
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cti_pgdata:
